<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', monospace" font-size="11">
  <title>Diagram UML - H3ButtonPlugin Audio Player</title>
  <desc>Klasy: ButtonPlugin, Player, AudioPlayer, Settings, Audio, PlayerDlg i ich powiazania</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a2e"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#1a1a2e" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="diamond" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto">
      <path d="M0,4 L5,0 L10,4 L5,8 Z" fill="#1a1a2e"/>
    </marker>
    <marker id="diamond-empty" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto">
      <path d="M0,4 L5,0 L10,4 L5,8 Z" fill="#fff" stroke="#1a1a2e" stroke-width="1"/>
    </marker>
  </defs>

  <style>
    .cls-header     { fill: #2d3561; }
    .cls-header-mid { fill: #1a6b72; }
    .cls-header-side{ fill: #4a3060; }
    .cls-header-hook{ fill: #5c3317; }
    .cls-header-data{ fill: #1e4d2b; }
    .cls-body       { fill: #f4f4f8; }
    .cls-border     { fill: none; stroke: #888; stroke-width: 1.2; }
    .cls-sep        { stroke: #aaa; stroke-width: 0.8; }
    .hdr-text       { fill: #fff; font-weight: 600; font-size: 12px; }
    .stereo         { fill: #ccc; font-size: 9px; font-style: italic; }
    .field          { fill: #1a1a2e; font-size: 10px; }
    .method         { fill: #1a3a6e; font-size: 10px; }
    .rel-label      { fill: #555; font-size: 9px; font-style: italic; }
    .section-label  { fill: #888; font-size: 9px; letter-spacing: 0.5px; }
  </style>

  <!-- KLASA: Player (centrum) -->
  <g id="Player">
    <rect x="310" y="260" width="200" height="220" class="cls-body cls-border"/>
    <rect x="310" y="260" width="200" height="22" class="cls-header-mid" rx="2"/>
    <text x="410" y="275" text-anchor="middle" class="hdr-text">Player</text>
    <line x1="310" y1="282" x2="510" y2="282" class="cls-sep"/>
    <text x="318" y="295" class="section-label">POLA</text>
    <text x="318" y="308" class="field">+ id_Player : int</text>
    <text x="318" y="320" class="field">+ current_time : int</text>
    <text x="318" y="332" class="field">- m_currentAudioId : int</text>
    <text x="318" y="344" class="field">- m_queue : deque&lt;QueueItem&gt;</text>
    <line x1="310" y1="352" x2="510" y2="352" class="cls-sep"/>
    <text x="318" y="364" class="section-label">METODY</text>
    <text x="318" y="377" class="method">+ Play() / Play(id)</text>
    <text x="318" y="389" class="method">+ PlayPath(id, path)</text>
    <text x="318" y="401" class="method">+ EnqueuePath(id, path)</text>
    <text x="318" y="413" class="method">+ Stop() / StopAndClose()</text>
    <text x="318" y="425" class="method">+ SeekRelative(deltaMs)</text>
    <text x="318" y="437" class="method">+ PlayNext() / PlayPrevious()</text>
    <text x="318" y="449" class="method">+ RemoveFromQueue(idx)</text>
    <text x="318" y="461" class="method">+ MoveInQueue(idx, dir)</text>
    <text x="318" y="473" class="method">+ Update()</text>
  </g>

  <!-- KLASA: AudioPlayer -->
  <g id="AudioPlayer">
    <rect x="30" y="260" width="188" height="210" class="cls-body cls-border"/>
    <rect x="30" y="260" width="188" height="22" class="cls-header-mid" rx="2"/>
    <text x="124" y="275" text-anchor="middle" class="hdr-text">AudioPlayer</text>
    <line x1="30" y1="282" x2="218" y2="282" class="cls-sep"/>
    <text x="38" y="295" class="section-label">POLA (prywatne)</text>
    <text x="38" y="308" class="field">- m_engine : ma_engine</text>
    <text x="38" y="320" class="field">- m_sound : ma_sound</text>
    <text x="38" y="332" class="field">- m_state : State</text>
    <line x1="30" y1="340" x2="218" y2="340" class="cls-sep"/>
    <text x="38" y="352" class="section-label">METODY</text>
    <text x="38" y="365" class="method">+ Open(path) : bool</text>
    <text x="38" y="377" class="method">+ Close()</text>
    <text x="38" y="389" class="method">+ Play() / Stop()</text>
    <text x="38" y="401" class="method">+ Pause() / Resume()</text>
    <text x="38" y="413" class="method">+ Seek(ms) : bool</text>
    <text x="38" y="425" class="method">+ GetPosition() : int</text>
    <text x="38" y="437" class="method">+ GetDuration() : int</text>
    <text x="38" y="449" class="method">+ SetVolume(0-1000)</text>
    <text x="38" y="461" class="method">+ IsFinished() : bool</text>
  </g>

  <!-- ENUM: State -->
  <g id="State">
    <rect x="30" y="500" width="120" height="72" class="cls-body cls-border"/>
    <rect x="30" y="500" width="120" height="22" fill="#2a5480" rx="2"/>
    <text x="90" y="508" text-anchor="middle" class="stereo">enumeration</text>
    <text x="90" y="518" text-anchor="middle" class="hdr-text" font-size="11">State</text>
    <line x1="30" y1="522" x2="150" y2="522" class="cls-sep"/>
    <text x="38" y="535" class="field">Stopped</text>
    <text x="38" y="547" class="field">Playing</text>
    <text x="38" y="559" class="field">Paused</text>
  </g>

  <!-- STRUCT: QueueItem -->
  <g id="QueueItem">
    <rect x="310" y="500" width="148" height="72" class="cls-body cls-border"/>
    <rect x="310" y="500" width="148" height="22" fill="#2a5480" rx="2"/>
    <text x="384" y="508" text-anchor="middle" class="stereo">struct</text>
    <text x="384" y="518" text-anchor="middle" class="hdr-text" font-size="11">QueueItem</text>
    <line x1="310" y1="522" x2="458" y2="522" class="cls-sep"/>
    <text x="318" y="535" class="field">+ id : int</text>
    <text x="318" y="547" class="field">+ path : string</text>
  </g>

  <!-- KLASA: Settings -->
  <g id="Settings">
    <rect x="560" y="260" width="188" height="210" class="cls-body cls-border"/>
    <rect x="560" y="260" width="188" height="22" class="cls-header-data" rx="2"/>
    <text x="654" y="275" text-anchor="middle" class="hdr-text">Settings</text>
    <line x1="560" y1="282" x2="748" y2="282" class="cls-sep"/>
    <text x="568" y="295" class="section-label">POLA</text>
    <text x="568" y="308" class="field">+ volume : int</text>
    <text x="568" y="320" class="field">+ auto_start : bool</text>
    <text x="568" y="332" class="field">+ linger_after_close : bool</text>
    <text x="568" y="344" class="field">+ playlist_mode : bool</text>
    <text x="568" y="356" class="field">+ selected_audio : int</text>
    <text x="568" y="368" class="field">+ audio_array : vector&lt;Audio&gt;</text>
    <text x="568" y="380" class="field">+ unlocked_ids : vector&lt;int&gt;</text>
    <line x1="560" y1="388" x2="748" y2="388" class="cls-sep"/>
    <text x="568" y="400" class="section-label">METODY</text>
    <text x="568" y="413" class="method">+ Load(path) / Save(path)</text>
    <text x="568" y="425" class="method">+ UnlockAudio(id) : bool</text>
    <text x="568" y="437" class="method">+ LockAudio(id) : bool</text>
    <text x="568" y="449" class="method">+ FindAudio(id) : Audio*</text>
    <text x="568" y="461" class="method">+ ApplyUnlockState()</text>
  </g>

  <!-- STRUCT: Audio -->
  <g id="Audio">
    <rect x="560" y="500" width="188" height="90" class="cls-body cls-border"/>
    <rect x="560" y="500" width="188" height="22" fill="#2a5480" rx="2"/>
    <text x="654" y="508" text-anchor="middle" class="stereo">struct</text>
    <text x="654" y="518" text-anchor="middle" class="hdr-text" font-size="11">Audio</text>
    <line x1="560" y1="522" x2="748" y2="522" class="cls-sep"/>
    <text x="568" y="535" class="field">+ id_Audio : int</text>
    <text x="568" y="547" class="field">+ directory : string</text>
    <text x="568" y="559" class="field">+ unlocked : bool</text>
    <text x="568" y="571" class="field">+ time : int  (ms)</text>
    <text x="568" y="583" class="field">+ mapFilter : string</text>
  </g>

  <!-- KLASA: PlayerDlg -->
  <g id="PlayerDlg">
    <rect x="310" y="50" width="200" height="148" class="cls-body cls-border"/>
    <rect x="310" y="50" width="200" height="22" class="cls-header-side" rx="2"/>
    <text x="410" y="58" text-anchor="middle" class="stereo">H3Dlg  500x260</text>
    <text x="410" y="68" text-anchor="middle" class="hdr-text" font-size="11">PlayerDlg</text>
    <line x1="310" y1="72" x2="510" y2="72" class="cls-sep"/>
    <text x="318" y="85" class="section-label">POLA</text>
    <text x="318" y="98" class="field">- m_rightScroll : int</text>
    <text x="318" y="110" class="field">- m_rightSel : int</text>
    <line x1="310" y1="118" x2="510" y2="118" class="cls-sep"/>
    <text x="318" y="130" class="section-label">METODY</text>
    <text x="318" y="143" class="method">+ OnCreate() : BOOL</text>
    <text x="318" y="155" class="method">+ OnLeftClick(id, msg)</text>
    <text x="318" y="167" class="method">+ UpdateRightList()</text>
    <text x="318" y="179" class="method">+ UpdateCenter()</text>
  </g>

  <!-- KLASA: ButtonPlugin -->
  <g id="ButtonPlugin">
    <rect x="30" y="50" width="188" height="150" class="cls-body cls-border"/>
    <rect x="30" y="50" width="188" height="22" class="cls-header-hook" rx="2"/>
    <text x="124" y="58" text-anchor="middle" class="stereo">HD plugin</text>
    <text x="124" y="68" text-anchor="middle" class="hdr-text" font-size="11">ButtonPlugin</text>
    <line x1="30" y1="72" x2="218" y2="72" class="cls-sep"/>
    <text x="38" y="85" class="section-label">HOOKI</text>
    <text x="38" y="98" class="method">HH_MsgDisplay()</text>
    <text x="38" y="110" class="method">HH_DlgProc()</text>
    <text x="38" y="122" class="method">HH_DefaultProc()</text>
    <text x="38" y="134" class="method">HH_H3Redraw()</text>
    <line x1="30" y1="142" x2="218" y2="142" class="cls-sep"/>
    <text x="38" y="154" class="section-label">GLOBALE</text>
    <text x="38" y="167" class="field">g_player : Player</text>
    <text x="38" y="179" class="field">g_textMap[], g_audioBasePath</text>
  </g>

  <!-- KLASA: miniaudio (zewnetrzna) -->
  <g id="miniaudio">
    <rect x="30" y="610" width="188" height="72" class="cls-body cls-border" stroke-dasharray="4,3"/>
    <rect x="30" y="610" width="188" height="22" fill="#555" rx="2"/>
    <text x="124" y="618" text-anchor="middle" class="stereo">external lib</text>
    <text x="124" y="628" text-anchor="middle" class="hdr-text" font-size="11">miniaudio</text>
    <line x1="30" y1="632" x2="218" y2="632" class="cls-sep"/>
    <text x="38" y="645" class="field">ma_engine, ma_sound</text>
    <text x="38" y="657" class="field">ma_sound_seek_to_pcm_frame</text>
    <text x="38" y="669" class="field">ma_sound_get_cursor_in_seconds</text>
  </g>

  <!-- LEGENDA -->
  <g id="legend" transform="translate(690,50)">
    <rect x="0" y="0" width="160" height="155" fill="#f4f4f8" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="80" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#1a1a2e">Legenda</text>
    <line x1="10" y1="32" x2="50" y2="32" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#diamond)"/>
    <text x="55" y="36" font-size="9" fill="#1a1a2e">kompozycja</text>
    <line x1="10" y1="52" x2="50" y2="52" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#diamond-empty)"/>
    <text x="55" y="56" font-size="9" fill="#1a1a2e">agregacja</text>
    <line x1="10" y1="72" x2="50" y2="72" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
    <text x="55" y="76" font-size="9" fill="#1a1a2e">uzytko / wywolanie</text>
    <line x1="10" y1="92" x2="50" y2="92" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="55" y="96" font-size="9" fill="#1a1a2e">zaleznosc</text>
    <rect x="10" y="108" width="12" height="10" fill="#1a6b72"/>
    <text x="26" y="118" font-size="9" fill="#1a1a2e">audio / logika</text>
    <rect x="10" y="124" width="12" height="10" fill="#1e4d2b"/>
    <text x="26" y="134" font-size="9" fill="#1a1a2e">dane / config</text>
    <rect x="10" y="140" width="12" height="10" fill="#5c3317"/>
    <text x="26" y="150" font-size="9" fill="#1a1a2e">plugin / hooki</text>
  </g>

  <!-- RELACJE -->

  <!-- Player - AudioPlayer (kompozycja) -->
  <line x1="310" y1="340" x2="218" y2="340" stroke="#1a1a2e" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow-open)"/>
  <text x="248" y="333" class="rel-label">m_audioPlayer</text>

  <!-- Player - Settings (kompozycja) -->
  <line x1="510" y1="340" x2="560" y2="340" stroke="#1a1a2e" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow-open)"/>
  <text x="516" y="333" class="rel-label">m_settings</text>

  <!-- Player - QueueItem* (kompozycja deque) -->
  <line x1="384" y1="480" x2="384" y2="500" stroke="#1a1a2e" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow-open)"/>
  <text x="388" y="496" class="rel-label">m_queue</text>

  <!-- Settings - Audio[] (kompozycja) -->
  <line x1="654" y1="470" x2="654" y2="500" stroke="#1a1a2e" stroke-width="1.5" marker-start="url(#diamond)" marker-end="url(#arrow-open)"/>
  <text x="658" y="496" class="rel-label">audio_array</text>

  <!-- AudioPlayer - State (uzycie) -->
  <line x1="90" y1="470" x2="90" y2="500" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
  <text x="94" y="492" class="rel-label">m_state</text>

  <!-- AudioPlayer - miniaudio (uzycie) -->
  <line x1="90" y1="572" x2="90" y2="610" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>

  <!-- PlayerDlg - Player (zaleznosc: wywoluje) -->
  <line x1="410" y1="210" x2="410" y2="260" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="414" y="240" class="rel-label">g_player (global)</text>

  <!-- ButtonPlugin - Player (zaleznosc: hook) -->
  <line x1="218" y1="125" x2="310" y2="310" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="225" y="220" class="rel-label">HH_MsgDisplay</text>
  <text x="225" y="231" class="rel-label">-&gt; EnqueuePath</text>

  <!-- ButtonPlugin - PlayerDlg (tworzy) -->
  <line x1="218" y1="100" x2="310" y2="120" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="226" y="108" class="rel-label">tworzy / otwiera</text>

  <!-- PlayerDlg - Settings (czyta) -->
  <line x1="510" y1="130" x2="560" y2="290" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
  <text x="525" y="200" class="rel-label">GetSettings()</text>
</svg>
